name: Update Static Libraries

# Rebuilds lib/<platform>/libkeccaktree.a from src/ whenever the C sources
# change on main (or on manual dispatch), tests them through the reusable
# Build & Test workflow, attests their build provenance, and COMMITS the
# result. This is the only workflow that writes to the repo. Its own commits
# only touch lib/, which is not in the path filter, so it does not retrigger
# itself.
#
# Pull requests that change src/ carry libraries their contributor built (see
# lib/README.md); this run replaces them with CI-built, attested ones after
# the merge.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build-static-libs.yml'
      - '.github/workflows/build.yml'

# A newer push to main supersedes a running rebuild: only the libraries of
# the latest main are committed.
concurrency:
  group: build-static-libs
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  collect-libraries:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: libkeccaktree-*
      - name: Move libraries into lib/
        run: |
          for platform in linux_amd64 linux_arm64 darwin_arm64 windows_amd64; do
            art="libkeccaktree-${platform//_/-}"
            mkdir -p "lib/$platform"
            cp "$art/libkeccaktree.a" "$art/libkeccaktree.a.sha256" "$art/libkeccaktree.a.buildinfo" "lib/$platform/"
            (cd "lib/$platform" && sha256sum -c libkeccaktree.a.sha256)
          done
          git rev-parse HEAD > lib/SOURCE_COMMIT
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: lib/*/libkeccaktree.a
      - name: Commit and push
        # authored by whoever pushed to main (the merger), committed by the bot
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add lib/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update static libraries for $(git rev-parse --short HEAD)

          Workflow run: ${WORKFLOW_URL}
          Verify: gh attestation verify lib/<platform>/libkeccaktree.a -R ${{ github.repository }}"
            git push
          fi
