name: Benchmark

# zen4 agent (round 2): AVX-512 kernel variants vs main on GitHub's hosted
# x86-64 runners (lottery: EPYC 7763 Zen 3 / 9V74 Zen 4 / 9V45 Zen 5 /
# Xeon 8370C Ice Lake / 6973P Granite Rapids). Push to bench/** or dispatch.
on:
  workflow_dispatch:
  push:
    branches: ['bench/**']

jobs:
  bench:
    name: ${{ matrix.runner }}-${{ matrix.n }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, n: 1}
          - {runner: macos-15, n: 2}
          - {runner: ubuntu-24.04-arm, n: 1}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CPU
        run: lscpu || sysctl -n machdep.cpu.brand_string
      - name: Build
        run: make -C src CC=clang test
      - name: Test
        continue-on-error: true
        run: build/test
      # the Go wrapper's dispatch and forced paths against this tree's lib
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go forced paths (this tree's lib)
        run: |
          export KECCAKTREE_EXPECT_PATH='sha3_x3|sha3_x3r|sha3_x2|neon_x3|neon_x2|scalar_x1'
          go test -count=1 -run 'TestForcedPaths|TestActivePathMatchesEnv|TestHash' -v . 2>&1 | grep -E "^(=== RUN|--- |PASS|FAIL|ok|    )" | grep -v "=== RUN" | head -60
      # interleaved A/B of this tree against main (bench/ab): ratio > 1 =
      # this tree faster; min and median of -n rounds per size
      - name: A/B vs main
        run: |
          CC=clang bench/ab/build.sh origin/main
          if [ "$(uname)" = Darwin ] || grep -qw sha3 /proc/cpuinfo; then K=auto,sha3_x3r,sha3_x3,sha3_x2
          elif grep -qw avx512f /proc/cpuinfo; then K=auto,avx512_x8d:avx512_x8,avx512_x9d:avx512_x9,avx512vl_x4d:avx512vl_x4,avx512_x8,avx512_x9,avx512vl_x4
          elif grep -qw avx2 /proc/cpuinfo; then K=auto,avx2_x8,avx2_x4
          else K=auto,generic; fi
          for i in 1 2; do build/ab -n 9 -s 1,2,4,5,8,9,16,64,256,1024 $K; echo; done
