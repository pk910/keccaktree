name: Bindings

# Rust, Nim and Java bindings on every native platform.
#
# - All three link the committed, attested lib/<platform>/libkeccaktree.a.
#   Rust and Nim are also tested building src/ themselves (their fallback for
#   targets without a library).
# - Java links the library into a JNI library per platform; the last job
#   packages all five into one jar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  rust:
    name: Rust - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64, runner: ubuntu-24.04 }
          - { name: linux x86-64 from source, runner: ubuntu-24.04, features: --features build-from-source }
          - { name: linux arm64, runner: ubuntu-24.04-arm }
          - { name: linux arm64 from source, runner: ubuntu-24.04-arm, features: --features build-from-source }
          - { name: macOS arm64, runner: macos-15 }
          - { name: windows x86-64 msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release ${{ matrix.features }} -- --nocapture
      - name: Example
        run: cargo run --release ${{ matrix.features }} --example basic_usage

  rust-windows-gnu:
    name: Rust - windows x86-64 gnu
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-rust
      - name: Test
        run: cargo test --release -- --nocapture

  nim:
    name: Nim ${{ matrix.nim }} - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64, runner: ubuntu-24.04, nim: 2.2.x }
          - { name: linux x86-64, runner: ubuntu-24.04, nim: 1.6.x }
          - { name: linux x86-64 from source, runner: ubuntu-24.04, nim: 2.2.x, flags: -d:keccaktreeFromSource }
          - { name: linux x86-64 clang from source, runner: ubuntu-24.04, nim: 2.2.x, flags: --cc:clang -d:keccaktreeFromSource }
          - { name: linux arm64, runner: ubuntu-24.04-arm, nim: 2.2.x }
          - { name: linux arm64 from source, runner: ubuntu-24.04-arm, nim: 2.2.x, flags: -d:keccaktreeFromSource }
          - { name: macOS arm64, runner: macos-15, nim: 2.2.x }
          - { name: windows x86-64, runner: windows-latest, nim: 2.2.x }
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: nim c -r -d:release ${{ matrix.flags }} nim/tests/test_keccaktree_abi.nim

  java-native:
    name: Java - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux_amd64, runner: ubuntu-24.04 }
          - { platform: linux_arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin_arm64, runner: macos-15 }
          - { platform: windows_amd64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Build JNI library (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: java/build-native.sh ${{ matrix.platform }}
      - name: Build JNI library
        if: runner.os != 'Windows'
        run: java/build-native.sh ${{ matrix.platform }}
      - name: Install Maven if missing
        if: runner.os != 'Windows'
        run: |
          command -v mvn && exit 0
          if [ "$RUNNER_OS" = macOS ]; then brew install maven; else sudo apt-get update && sudo apt-get install -y maven; fi
      - name: Test
        working-directory: java
        run: mvn -B test
      - uses: actions/upload-artifact@v4
        with:
          name: keccaktree-jni-${{ matrix.platform }}
          path: java/native/
          retention-days: 7

  rust-riscv64:
    # debian:trixie for qemu 10, whose riscv_hwprobe reports Zvkb
    name: Rust - linux riscv64 (qemu)
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
      AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
    steps:
      - name: Install cross toolchain, qemu and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gcc libc6-dev gcc-riscv64-linux-gnu qemu-user >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target riscv64gc-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Test (prebuilt lib and from source, several CPUs)
        run: |
          for cpu in rv64,zbb=false rv64,v=true,vlen=128 rv64,v=true,vlen=256,zvkb=true; do
            for features in "" "--features build-from-source"; do
              echo "::group::$cpu $features"
              CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER="qemu-riscv64 -L /usr/riscv64-linux-gnu -cpu $cpu" \
                cargo test --release --target riscv64gc-unknown-linux-gnu $features -- --nocapture
              echo "::endgroup::"
            done
          done

  nim-riscv64:
    name: Nim 2.2.x - linux riscv64 (qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.2.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cross toolchain and qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu qemu-user >/dev/null
      - name: Test (prebuilt lib and from source)
        run: |
          nimcross="--cpu:riscv64 --os:linux --gcc.exe:riscv64-linux-gnu-gcc --gcc.linkerexe:riscv64-linux-gnu-gcc"
          nim c -d:release $nimcross -o:test-prebuilt nim/tests/test_keccaktree_abi.nim
          nim c -d:release -d:keccaktreeFromSource $nimcross -o:test-source nim/tests/test_keccaktree_abi.nim
          for cpu in rv64,zbb=false rv64,v=true,vlen=128; do
            for t in prebuilt source; do
              echo "== $cpu $t"
              qemu-riscv64 -L /usr/riscv64-linux-gnu -cpu $cpu ./test-$t
            done
          done

  java-riscv64:
    name: Java - linux_riscv64 (qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build JNI library (cross)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu >/dev/null
          CC=riscv64-linux-gnu-gcc java/build-native.sh linux_riscv64
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Test on a riscv64 JDK
        run: |
          docker run --rm --platform linux/riscv64 -v "$PWD:/w" -w /w/java debian:trixie bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq openjdk-21-jdk-headless maven >/dev/null
            mvn -B -q test
            cat target/surefire-reports/*.txt
          '
      - uses: actions/upload-artifact@v4
        with:
          name: keccaktree-jni-linux_riscv64
          path: java/native/
          retention-days: 7

  java-jar:
    name: Java - jar with all platforms
    runs-on: ubuntu-24.04
    needs: [java-native, java-riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          pattern: keccaktree-jni-*
          path: java/native
          merge-multiple: true
      - name: Package and test the jar
        working-directory: java
        run: |
          ls -R native
          mvn -B package
          unzip -l target/keccaktree-*.jar | grep native/
      - uses: actions/upload-artifact@v4
        with:
          name: keccaktree-java
          path: java/target/keccaktree-*.jar
          retention-days: 30
