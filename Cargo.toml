[package]
name = "keccaktree"
version = "0.1.0"
authors = ["pk910"]
edition = "2021"
description = "Batched keccak256 for Merkle trees, a drop-in for hashtree (hand-written AVX-512/AVX2/NEON/SHA3 kernels)"
repository = "https://github.com/pk910/keccaktree"
license = "MIT"
keywords = ["keccak", "keccak256", "merkle", "hash", "ethereum"]
categories = ["cryptography", "algorithms"]
build = "build.rs"
links = "keccaktree"
include = [
    "Cargo.toml",
    "build.rs",
    "src/lib.rs",
    "src/keccaktree.c",
    "src/keccak256_generic.c",
    "src/keccaktree.h",
    "src/*.S",
    "src/*.inc",
    "lib/*/libkeccaktree.a",
    "LICENSE",
]

[features]
# Compile src/ with the cc crate instead of linking the attested static
# library from lib/<platform>/ (targets without a library always do).
build-from-source = []

[dev-dependencies]
sha3 = "0.10"

[build-dependencies]
cc = "1.0"
